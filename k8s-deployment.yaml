# A Deployment and a Service, replacing `kubectl run`. The old run_kubernetes.sh
# did `kubectl run app --image=... --port=80` and then
# `kubectl port-forward deployment/app`, but `kubectl run` creates a bare Pod, so
# the port-forward referred to a Deployment that never existed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: sklearn-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sklearn-prediction
  template:
    metadata:
      labels:
        app: sklearn-prediction
    spec:
      securityContext:
        # The image already drops to appuser; this makes the cluster enforce it
        # rather than trusting the image.
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          # Replace with your own Docker ID/path, or set it via
          # `kubectl set image deployment/app app=<your-id>/app:<tag>`.
          image: underneaththebridge/app:latest
          # A :latest tag defaults to imagePullPolicy: Always, which sends the
          # kubelet to the registry even when you have just built the image
          # locally and never pushed it, giving ImagePullBackOff. The README's
          # flow is build-then-apply, so prefer the local image if it is there.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # readOnlyRootFilesystem needs somewhere writable: joblib and sklearn
          # use the temp directory, so give them one that is not the image.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Without limits a single pod can consume a node. sklearn inference on
          # six features is small; raise these if you swap the model.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
          # Cold start imports pandas, scipy and sklearn and loads two joblib
          # artifacts, under a 500m CPU limit. With the default period of 10s and
          # threshold of 3, a 15s delay left ~45s before a restart, so a slow node
          # produced a CrashLoopBackOff that looks like an application bug.
          # Kubernetes 1.18 added startupProbe for exactly this, but it landed the
          # day after this repo was created, so widen the liveness window instead.
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: sklearn-prediction
  ports:
    - port: 8080
      targetPort: 8080
